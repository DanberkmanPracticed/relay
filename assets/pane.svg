<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-label="The Relay pane with three agents: Opus reviewing bugs at about 62 percent, Sonnet checking performance at step 3 of 5, and Haiku finished">
